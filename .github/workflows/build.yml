name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev lld
          pip install buildozer cython==0.29.36 setuptools

      - name: Build APK with Buildozer
        run: |
          buildozer init
          cat << 'EOF' >> buildozer.spec
          title = Podvodni Dron ROV
          package.name = rovkokpit
          requirements = python3==3.11.6,hostpython3==3.11.6,kivy==2.3.0
          orientation = landscape
          android.permissions = INTERNET,ACCESS_NETWORK_STATE,WAKE_LOCK
          android.ndk = 25b
          android.archs = arm64-v8a
          EOF
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rovkokpit-apk
          path: bin/*.apk
