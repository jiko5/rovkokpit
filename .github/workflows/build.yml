name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create buildozer.spec
        run: |
          echo "[app]" > buildozer.spec
          echo "title = Podvodni Dron ROV" >> buildozer.spec
          echo "package.name = rovkokpit" >> buildozer.spec
          echo "package.domain = org.rov" >> buildozer.spec
          echo "source.dir = ." >> buildozer.spec
          echo "source.include_exts = py,png,jpg,kv,atlas" >> buildozer.spec
          echo "version = 0.1" >> buildozer.spec
          echo "requirements = python3==3.10.13,hostpython3==3.10.13,kivy==2.2.1" >> buildozer.spec
          echo "orientation = landscape" >> buildozer.spec
          echo "fullscreen = 1" >> buildozer.spec
          echo "android.permissions = INTERNET,ACCESS_NETWORK_STATE,WAKE_LOCK" >> buildozer.spec
          echo "android.api = 33" >> buildozer.spec
          echo "android.minapi = 24" >> buildozer.spec
          echo "android.ndk = 25b" >> buildozer.spec
          echo "android.archs = arm64-v8a" >> buildozer.spec
          echo "android.accept_sdk_license = True" >> buildozer.spec
          echo "[buildozer]" >> buildozer.spec
          echo "log_level = 1" >> buildozer.spec
          echo "warn_on_root = 0" >> buildozer.spec

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rovkokpit-apk
          path: bin/*.apk
