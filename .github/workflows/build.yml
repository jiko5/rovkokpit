name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          pip install buildozer cython==0.29.36

      - name: Build APK with Buildozer
        run: |
          buildozer init
          sed -i 's/title = My Application/title = Podvodni Dron ROV/g' buildozer.spec
          sed -i 's/package.name = myapp/package.name = rovkokpit/g' buildozer.spec
          sed -i 's/orientation = portrait/orientation = landscape/g' buildozer.spec
          sed -i 's/#android.permissions = INTERNET/android.permissions = INTERNET,ACCESS_NETWORK_STATE,WAKE_LOCK/g' buildozer.spec
          sed -i 's/#android.ndk = 25b/android.ndk = 25b/g' buildozer.spec
          sed -i 's/android.archs = arm64-v8a, armeabi-v7a/android.archs = arm64-v8a/g' buildozer.spec
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rovkokpit-apk
          path: bin/*.apk
